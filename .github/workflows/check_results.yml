name: Check Lottery Results (Thursday 7:40PM & Saturday 9:05PM KST)

on:
  workflow_dispatch:
  schedule:
    # 매주 목요일 오후 7:40 KST (UTC 목요일 10:40) - 연금복권 720+ 추첨 직후 결과 확인
    - cron: '40 10 * * 4'
    # 매주 토요일 오후 9:05 KST (UTC 토요일 12:05) - 로또 6/45 추첨 직후 결과 확인
    - cron: '5 12 * * 6'

jobs:
  check-results:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Create .env file
      run: |
        echo "USER_ID=${{ secrets.USER_ID }}" >> .env
        echo "PASSWD=${{ secrets.PASSWD }}" >> .env
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

    - name: Check Lotto Results
      env:
        PYTHONPATH: src
        USER_ID: ${{ secrets.USER_ID }}
        PASSWD: ${{ secrets.PASSWD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python src/check_results.py

    - name: Build Dashboard Data
      if: always()
      run: |
        python scripts/build_dashboard.py || echo "⚠️ Dashboard data build skipped"

    - name: Commit and Push Results and Dashboard Data
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/data.json data/purchased_lotto.json data/purchased_pension720.json 2>/dev/null || true
        git diff-index --quiet HEAD || git commit -m "chore: update lottery results and dashboard data [skip ci]"
        git push origin HEAD || echo "ℹ️ Nothing to push or push skipped"

