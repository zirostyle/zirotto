name: Lotto Purchase (Run on GitHub) - Auto

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/purchase.yml'
  schedule:
    # 매일 오전 9:00 KST (UTC 00:00)
    - cron: '0 0 * * *'
    # 매일 오후 6:00 KST (UTC 09:00)
    - cron: '0 9 * * *'

jobs:
  purchase:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Create .env file
      run: |
        echo "USER_ID=${{ secrets.USER_ID }}" >> .env
        echo "PASSWD=${{ secrets.PASSWD }}" >> .env
        echo "CHARGE_PIN=${{ secrets.CHARGE_PIN }}" >> .env
        echo "AUTO_GAMES=${{ secrets.AUTO_GAMES || '0' }}" >> .env
        echo "MANUAL_NUMBERS=${{ secrets.MANUAL_NUMBERS || '[]' }}" >> .env
        echo "LOTTO720_AMOUNT=${{ secrets.LOTTO720_AMOUNT || '10000' }}" >> .env
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
        # Check file capability without exposing content
        ls -la .env

    - name: Run Lotto Purchase Workflow
      env:
        PYTHONPATH: src
        VENV_PYTHON: python  # Use system python set up by actions
      run: |
        chmod +x scripts/purchase.sh
        bash scripts/purchase.sh
