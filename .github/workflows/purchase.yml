name: Lotto Purchase (Run on GitHub) - Auto

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '.github/workflows/purchase.yml'
  schedule:
    # 매주 월요일 오전 7:00 KST (UTC 일요일 22:00)
    - cron: '0 22 * * 0'

jobs:
  purchase:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Run tests
      run: python -m pytest tests/ -v

    - name: Create .env file
      run: |
        echo "USER_ID=${{ secrets.USER_ID }}" >> .env
        echo "PASSWD=${{ secrets.PASSWD }}" >> .env
        echo "CHARGE_PIN=${{ secrets.CHARGE_PIN }}" >> .env
        echo "AUTO_GAMES=${{ secrets.AUTO_GAMES || '0' }}" >> .env
        echo "MANUAL_NUMBERS=${{ secrets.MANUAL_NUMBERS || '[]' }}" >> .env
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
        # Check file capability without exposing content
        ls -la .env

    - name: Check Lotto Results (당첨번호 + 구매복권 당첨여부)
      env:
        PYTHONPATH: src
      run: |
        python src/check_results.py || echo "당첨결과 확인 실패해도 구매 진행"

    - name: Run Lotto Purchase Workflow (로또645 + 연금복권)
      env:
        PYTHONPATH: src
        VENV_PYTHON: python
      run: |
        chmod +x scripts/purchase.sh
        bash scripts/purchase.sh
