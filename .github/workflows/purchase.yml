name: Lotto Purchase (Run on GitHub) - Auto

on:
  workflow_dispatch:
  schedule:
    # 매주 월요일 오전 7:00 KST (일요일 22:00 UTC)
    - cron: '0 22 * * 0'

concurrency:
  group: lotto-purchase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purchase:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

    - name: Install Python Dependencies
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps chromium

    - name: Create .env file
      run: |
        echo "USER_ID=${{ secrets.USER_ID }}" >> .env
        echo "PASSWD=${{ secrets.PASSWD }}" >> .env
        echo "CHARGE_PIN=${{ secrets.CHARGE_PIN }}" >> .env
        echo "AUTO_GAMES=${{ secrets.AUTO_GAMES || '0' }}" >> .env
        echo "MANUAL_NUMBERS=${{ secrets.MANUAL_NUMBERS || '[]' }}" >> .env
        echo "LOTTO720_AMOUNT=${{ secrets.LOTTO720_AMOUNT || '10000' }}" >> .env
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
        # Check file capability without exposing content
        ls -la .env

    - name: Run Lotto Purchase Workflow
      timeout-minutes: 15
      env:
        PYTHONPATH: src
        VENV_PYTHON: python  # Use system python set up by actions
        ENABLE_LOTTO645: "1"
        LOTTO645_ENABLE_FROM: "2026-02-23"  # KST 기준 다음 주 월요일부터 6/45 재개
      run: |
        chmod +x scripts/purchase.sh
        bash scripts/purchase.sh
