name: One-time Lotto 720 Purchase Retry

on:
  push:
    branches:
      - fix/p0-bugs-strategy-720-notifications

concurrency:
  group: lotto720-one-time-purchase-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purchase-minimum:
    if: "${{ github.event.head_commit.message == 'test: retry one-time 720 purchase' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run guarded minimum purchase retry
        env:
          USER_ID: ${{ secrets.USER_ID }}
          PASSWD: ${{ secrets.PASSWD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG: '1'
          LOG_LEVEL: INFO
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: python scripts/test_lotto720_once.py
